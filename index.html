<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly Timesheet</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#e8622c">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --ink:#14181f;
    --paper:#f6f4ef;
    --card:#ffffff;
    --line:#d9d4c8;
    --accent:#e8622c;
    --accent-dark:#b8481c;
    --good:#2f7a4f;
    --muted:#6b6459;
    --mono: 'SF Mono', 'Menlo', 'Consolas', monospace;
  }
  @keyframes flashRed{
    0%,100%{ box-shadow:0 0 0 0 rgba(220,53,34,0); border-color:#333a48; }
    20%,60%{ box-shadow:0 0 0 4px rgba(220,53,34,0.55); border-color:#dc3522; }
  }
  #weekEnding.flash-warn{ animation:flashRed 0.6s ease-in-out 2; }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:100px;
  }
  header{
    background:var(--ink); color:#fff; padding:18px 16px 14px;
    position:sticky; top:0; z-index:20; transition:padding .15s;
  }
  header .brand{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#a7a196; font-weight:600}
  header h1{margin:2px 0 10px; font-size:20px; font-weight:800; letter-spacing:-.01em}
  body.kb-open header{ position:static; padding:8px 16px 6px; }
  body.kb-open header .brand-logo, body.kb-open #jnRefreshIcon{ display:none; }
  @keyframes spin{ from{transform:rotate(0)} to{transform:rotate(360deg)} }
  #jnRefreshIcon.spinning{ animation:spin 0.7s linear infinite; }
  .weekbar{display:flex; gap:8px; align-items:center}
  .weekbar input[type=date]{
    flex:1; background:#1f2530; border:1px solid #333a48; color:#fff;
    border-radius:8px; padding:9px 10px; font-size:14px;
  }
  .daytabs{
    display:flex; gap:6px; overflow-x:auto; padding:10px 16px 12px; background:var(--ink);
    position:sticky; top:88px; z-index:19; -ms-overflow-style:none; scrollbar-width:none;
  }
  body.kb-open .daytabs{ position:static; top:auto; padding:6px 16px 8px; }
  .daytabs::-webkit-scrollbar{display:none}
  .daytab{
    flex:0 0 auto; padding:8px 12px; border-radius:20px; font-size:12.5px; font-weight:700;
    background:#1f2530; color:#b8b2a5; border:1px solid #333a48; white-space:nowrap;
  }
  .daytab.active{background:var(--accent); color:#fff; border-color:var(--accent)}
  .daytab .h{display:block; font-size:9px; font-weight:600; opacity:.75}
  main{padding:14px 16px 0; max-width:640px; margin:0 auto}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px; margin-bottom:14px;
  }
  .card h2{
    margin:0 0 12px; font-size:12px; text-transform:uppercase; letter-spacing:.1em;
    color:var(--muted); font-weight:800; display:flex; justify-content:space-between; align-items:center;
  }
  .field{margin-bottom:11px}
  .field label{display:block; font-size:12.5px; font-weight:600; color:#3a362e; margin-bottom:4px}
  .field input, .field select{
    width:100%; padding:10px 11px; border:1.5px solid var(--line); border-radius:9px;
    font-size:15px; background:#fcfbf8; color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--accent)}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
  .daily-total{
    background:#fbf3e9; border:1px solid #ecd9bd; border-radius:9px; padding:10px 12px;
    display:flex; justify-content:space-between; align-items:center; margin-top:2px;
  }
  .daily-total .num{font-size:20px; font-weight:800; color:var(--accent-dark)}
  .daily-total .lbl{font-size:12px; font-weight:700; color:#7a5a34; text-transform:uppercase; letter-spacing:.06em}
  .daily-total.match{background:#eaf5ee; border-color:#bfe3cb}
  .daily-total.match .num, .daily-total.match .lbl{color:var(--good)}
  .daily-total.mismatch{background:#fbeee9; border-color:#f0c4b4}
  .daily-total.mismatch .num, .daily-total.mismatch .lbl{color:#b8481c}
  .job-row{border-top:1px dashed var(--line); padding-top:10px; margin-top:10px}
  .job-row:first-of-type{border-top:none; padding-top:0; margin-top:0}
  .addjob{
    width:100%; padding:9px; border-radius:9px; border:1.5px dashed var(--line);
    background:none; color:var(--muted); font-weight:700; font-size:13px;
  }
  .sigpad{
    width:100%; height:120px; border:1.5px solid var(--line); border-radius:9px;
    background:#fcfbf8; touch-action:none;
  }
  .sigrow{display:flex; justify-content:space-between; align-items:center; margin-top:6px}
  .sigrow button{background:none; border:none; color:var(--accent-dark); font-size:12.5px; font-weight:700; padding:4px}
  .summary-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .sum-tile{background:#fcfbf8; border:1px solid var(--line); border-radius:9px; padding:10px 12px}
  .sum-tile .n{font-size:17px; font-weight:800}
  .sum-tile .l{font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em}
  .total-hero{
    background:var(--ink); color:#fff; border-radius:14px; padding:16px; margin-bottom:14px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .total-hero .n{font-size:34px; font-weight:800; color:var(--accent)}
  .total-hero .l{font-size:12px; color:#a7a196; text-transform:uppercase; letter-spacing:.08em; font-weight:700}
  .actionbar{
    position:fixed; bottom:0; left:0; right:0; background:var(--card);
    border-top:1px solid var(--line); padding:10px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex; gap:10px; z-index:30;
  }
  .actionbar button{
    flex:1; padding:13px; border-radius:11px; font-size:14.5px; font-weight:800; border:none;
  }
  .btn-secondary{background:#eeeae1; color:var(--ink)}
  .btn-primary{background:var(--accent); color:#fff}
  .btn-primary:active, .btn-secondary:active{opacity:.8}
  .toast{
    position:fixed; bottom:78px; left:16px; right:16px; background:var(--ink); color:#fff;
    padding:11px 14px; border-radius:10px; font-size:13.5px; text-align:center; z-index:40;
    opacity:0; transform:translateY(8px); transition:.25s; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateY(0)}
  .hint{font-size:11.5px; color:var(--muted); margin-top:-4px; margin-bottom:10px; line-height:1.4}
  .undo-bar{
    position:fixed; left:16px; right:16px; bottom:calc(70px + env(safe-area-inset-bottom));
    background:#14181f; color:#fff; padding:11px 14px; border-radius:11px;
    display:none; align-items:center; justify-content:space-between;
    font-size:13.5px; font-weight:600; z-index:35; box-shadow:0 6px 18px rgba(0,0,0,.3);
  }
  .undo-bar.show{ display:flex; }
  .undo-bar button{ background:var(--accent); color:#fff; border:none; padding:7px 16px; border-radius:8px; font-weight:800; font-size:13px; }
</style>
</head>

const CLIENTS = ['N/A','NCH PORTHEDLAND','NCH NEWMAN','NCH FLIGHTS','NCH LOGISTICS','HIO','FMG','BHP','RIOTINTO','GOODLINE','TITIANS','NGL','LINKFORCE'];
const CLIENT_SITE_MAP = {
  'NCH PORTHEDLAND':'Porthedland',
  'NCH NEWMAN':'Newman',
  'NCH FLIGHTS':'Flights',
  'NCH LOGISTICS':'Logistics'
};

// Paste your deployed Apps Script web app URL here once (see job-numbers-setup.md)
const JOB_NUMBERS_URL = "https://script.google.com/macros/s/AKfycbwz-_Kv2IZsIMSjGyGNaukgTkWzOeHZ41AYBi8KQk8_r3brabwvvwyZ8oDbKlaxMUzW/exec";

function getJobNumbersData(){
  try{ return JSON.parse(localStorage.getItem('jobNumbersData')||'[]'); }catch(e){ return []; }
}
function getJobNumbersUpdated(){
  return localStorage.getItem('jobNumbersFetched') || '';
}
function lookupJobNumber(client, dateISO){
  const site = CLIENT_SITE_MAP[client];
  if(!site || !dateISO) return '';
  const [y, m] = dateISO.split('-');
  const monthKey = `${m}-${y}`; // e.g. 08-2026
  const row = getJobNumbersData().find(r=> String(r.Month).trim() === monthKey);
  return row && row[site] ? String(row[site]) : '';
}
async function fetchJobNumbers(silent){
  if(!JOB_NUMBERS_URL || JOB_NUMBERS_URL.startsWith('PASTE_')) return;
  const icon = document.getElementById('jnRefreshIcon');
  if(icon) icon.classList.add('spinning');
  try{
    const res = await fetch(JOB_NUMBERS_URL);
    const data = await res.json();
    localStorage.setItem('jobNumbersData', JSON.stringify(data));
    localStorage.setItem('jobNumbersFetched', new Date().toISOString());
    localStorage.setItem('jobNumbersFetchedMonth', new Date().toISOString().slice(0,7));
    if(!silent) showToast('Job numbers updated');
    renderJobNumbersCard();
  }catch(e){
    if(!silent) showToast('Could not refresh — check connection');
  }
  if(icon) icon.classList.remove('spinning');
}
function checkForNewMonth(){
  const currentYM = new Date().toISOString().slice(0,7);
  const lastFetchedYM = localStorage.getItem('jobNumbersFetchedMonth');
  if(lastFetchedYM !== currentYM) fetchJobNumbers(true); // new month since last check — force a refresh
}
function renderJobNumbersCard(){
  const el = document.getElementById('jobNumbersCard');
  if(!el) return;
  const updated = getJobNumbersUpdated();
  const updatedTxt = updated ? new Date(updated).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : 'never';
  el.innerHTML = `
    <h2>Job numbers</h2>
    <div class="hint">Last updated: ${updatedTxt}</div>
    <button class="addjob" onclick="fetchJobNumbers(false)">↻ Refresh job numbers</button>
  `;
}

const FIELD_DEFS = [
  ['start','Start time','time'],
  ['finish','Finish time','time'],
  ['lunch','Lunch break (mins)','number'],
  ['nsStand','NS stand down (hrs)','number'],
  ['leave','Leave (specify: AL/PL/RDO/R&R/CL/LWOP)','text'],
  ['fifo','FIFO travel time (hrs)','number'],
  ['travelOwn','Travel allow — own car','number'],
  ['siteAllow','Site specific allow.','number'],
  ['leadHand','Leading hand allow.','number'],
  ['supAllow','Supervisor allow.','number'],
  ['higherDuties','Higher duties (crane size)','text'],
  ['laha','Shared accom (LAHA)','number'],
  ['truckOvernight','Truck overnight allow.','number'],
];

function defaultState(){
  return {
    empName:'', weekEnding:'', empPrint:'', supPrint:'', position:'Full time',
    days: DAYS.map(()=>({date:'',start:'',finish:'',lunch:'',nsStand:'',leave:'',fifo:'',
      travelOwn:'',siteAllow:'',leadHand:'',supAllow:'',higherDuties:'',laha:'',truckOvernight:'',
      jobs:[{no:'',client:'',hours:'',noAuto:false}]}))
  };
}
let state = defaultState();
let activeDay = 0;
let preClearBackup = null;

function calcDailyHours(d){
  return d.jobs.reduce((s,j)=> s + (parseFloat(j.hours)||0), 0);
}

const HD_OPTS = ['-','201T-300T','301T-400T','650T'];

function renderTabs(){
  const el = document.getElementById('dayTabs');
  el.innerHTML = DAYS.map((d,i)=>{
    const hrs = calcDailyHours(state.days[i]).toFixed(1);
    return `<button class="daytab ${i===activeDay?'active':''}" onclick="setDay(${i})">
      <span class="h">${d.slice(0,3).toUpperCase()}</span>${hrs}h</button>`;
  }).join('');
}
function setDay(i){ activeDay=i; renderTabs(); renderDay(); }

function copyFromPreviousDay(){
  if(activeDay===0) return;
  const keepDate = state.days[activeDay].date;
  state.days[activeDay] = JSON.parse(JSON.stringify(state.days[activeDay-1]));
  state.days[activeDay].date = keepDate;
  renderDay(); renderTabs(); renderTotals();
  showToast(`Copied ${DAYS[activeDay-1]}'s details — adjust anything that's different`);
}

function renderDay(){
  const d = state.days[activeDay];
  const hrs = calcDailyHours(d);
  let html = `
    <h2>${DAYS[activeDay]} <span style="font-weight:600;color:var(--muted);text-transform:none;font-size:11.5px">Day ${activeDay+1} of 7</span></h2>
  `;
  if(activeDay>0){
    html += `<button class="addjob" style="margin-bottom:12px" onclick="copyFromPreviousDay()">↻ Copy ${DAYS[activeDay-1]}'s details</button>`;
  }
  html += `
    <div class="field"><label>Date <span style="font-weight:500; text-transform:none; font-size:10.5px">(set via Week Ending above)</span></label><input type="date" value="${d.date}" readonly onclick="flashWeekEnding(); this.blur();" style="background:#f0ede5; color:var(--muted)"></div>
    <div class="row2">
      <div class="field"><label>Start time</label><input type="time" data-f="start" value="${d.start}"></div>
      <div class="field"><label>Finish time</label><input type="time" data-f="finish" value="${d.finish}"></div>
    </div>
    <div class="field"><label>Lunch break (mins)</label><input type="number" inputmode="numeric" data-f="lunch" value="${d.lunch}"></div>
    <div class="daily-total"><span class="lbl">Total daily hours <span style="font-weight:500; text-transform:none; font-size:10.5px">(sum of job hours)</span></span><span class="num" id="dailyTotalNum">${hrs.toFixed(1)}</span></div>
  `;
  const rest = FIELD_DEFS.slice(3);
  html += `<div style="margin-top:14px">`;
  rest.forEach(([key,label,type])=>{

function isoAddDays(iso, delta){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  dt.setUTCDate(dt.getUTCDate() + delta);
  const yy = dt.getUTCFullYear();
  const mm = String(dt.getUTCMonth()+1).padStart(2,'0');
  const dd = String(dt.getUTCDate()).padStart(2,'0');
  return `${yy}-${mm}-${dd}`;
}
function populateWeekDates(weekEndingISO){
  if(!weekEndingISO) return;
  for(let i=0;i<7;i++){
    state.days[i].date = isoAddDays(weekEndingISO, -(6-i));
  }
  renderDay(); renderTabs();
}

// --- signature pads ---
function setupSig(id){
  const c = document.getElementById(id);
  function resize(){
    const ratio = window.devicePixelRatio||1;
    const rect = c.getBoundingClientRect();
    c.width = rect.width*ratio; c.height = rect.height*ratio;
    c.getContext('2d').scale(ratio,ratio);
  }
  resize();
  const ctx = c.getContext('2d');
  ctx.strokeStyle='#14181f'; ctx.lineWidth=2.2; ctx.lineCap='round';
  let drawing=false, last=null;
  function pos(e){
    const r=c.getBoundingClientRect();
    const t = e.touches? e.touches[0]:e;
    return {x:t.clientX-r.left, y:t.clientY-r.top};
  }
  function start(e){ drawing=true; last=pos(e); e.preventDefault(); }
  function move(e){
    if(!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last=p; e.preventDefault();
  }
  function end(){ drawing=false; }
  c.addEventListener('mousedown',start); c.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  c.addEventListener('touchstart',start,{passive:false}); c.addEventListener('touchmove',move,{passive:false}); c.addEventListener('touchend',end);
}
function clearSig(id){
  const c = document.getElementById(id), ctx=c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
}
function restoreSigFromDataUrl(canvasId, dataUrl){
  const c = document.getElementById(canvasId);
  const ctx = c.getContext('2d');
  const img = new Image();
  img.onload = ()=>{
    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,c.width,c.height);
    ctx.drawImage(img,0,0);
    ctx.restore();
  };
  img.src = dataUrl;
}
setupSig('empSig'); setupSig('supSig');

function clearForm(){
  if(!confirm("Start a new week? This clears all the day entries, hours, and week ending date — your name and signature stay put. You can undo this right after.")) return;
  const empC = document.getElementById('empSig'), supC = document.getElementById('supSig');
  preClearBackup = {
    state: JSON.parse(JSON.stringify(state)),
    activeDay,
    empSig: empC.toDataURL(),
    supSig: supC.toDataURL()
  };
  const keepEmpName = state.empName;
  const keepEmpPrint = state.empPrint;
  state = defaultState();
  state.empName = keepEmpName;
  state.empPrint = keepEmpPrint;
  activeDay = 0;
  renderHeaderFields();
  // signatures are intentionally left as-is — no need to re-sign each week
  renderTabs(); renderDay(); renderTotals();
  document.getElementById('undoBar').classList.add('show');
  showToast('New week ready — name & signature kept');
}

function undoClear(){
  if(!preClearBackup) return;
  state = preClearBackup.state;
  activeDay = preClearBackup.activeDay || 0;
  renderHeaderFields();
  restoreSigFromDataUrl('empSig', preClearBackup.empSig);
  restoreSigFromDataUrl('supSig', preClearBackup.supSig);
  renderTabs(); renderDay(); renderTotals();
  preClearBackup = null;
  document.getElementById('undoBar').classList.remove('show');
  showToast('Form restored');
}

function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}`;
}
function drawCell(doc,x,y,w,h,text,opts={}){
  const o = Object.assign({align:'left',bold:false,size:7,fill:null,color:[20,20,20],border:true,pad:3},opts);
  if(o.fill){ doc.setFillColor(o.fill[0],o.fill[1],o.fill[2]); doc.rect(x,y,w,h,'F'); }
  if(o.border){ doc.setDrawColor(153,153,153); doc.setLineWidth(0.4); doc.rect(x,y,w,h,'S'); }
  if(text){
    doc.setFont(undefined, o.bold?'bold':'normal');
    doc.setFontSize(o.size);
    doc.setTextColor(o.color[0],o.color[1],o.color[2]);
    const ty = y + h/2 + o.size*0.32;
    if(o.align==='left') doc.text(String(text), x+o.pad, ty);
    else if(o.align==='right') doc.text(String(text), x+w-o.pad, ty, {align:'right'});
    else doc.text(String(text), x+w/2, ty, {align:'center'});
  }
}

  }catch(e){}
  drawCell(doc,x,footTop+footH-14,55,14,'PRINT NAME:',{align:'left',bold:true,size:6.5});
  drawCell(doc,x+55,footTop+footH-14,c2-55,14,state.supPrint||'',{size:7});

  x += c2;
  const legH = footH*0.5;

    doc.text(l, x+4, footTop+16+i*7);
  });
  const alwX = x+c3*0.55, alwW = c3*0.45, rh = legH/4;
  const week = state.days.reduce((s,d)=>s+calcDailyHours(d),0);
  const nsStandSum = state.days.reduce((s,d)=>s+(parseFloat(d.nsStand)||0),0);
  const travel = state.days.reduce((s,d)=>s+(parseFloat(d.travelOwn)||0),0);
  const lead = state.days.reduce((s,d)=>s+(parseFloat(d.leadHand)||0),0);
  const sup = state.days.reduce((s,d)=>s+(parseFloat(d.supAllow)||0),0);
  const fifoSum = state.days.reduce((s,d)=>s+(parseFloat(d.fifo)||0),0);
  const northwest = Math.max(0, week - fifoSum - nsStandSum); // Northwest allowance = productivity allowance
  [['NORTHWEST ALLOWANCE',northwest],['TRAVEL ALLOWANCE',travel],['LEADING HAND ALLOWANCE',lead],['SUPERVISOR ALLOWANCE',sup]].forEach(([lbl,val],i)=>{

  return doc;

function fileName(){
  const nm = (state.empName||'timesheet').trim().replace(/\s+/g,'_');
  return `Timesheet_${nm}_${state.weekEnding||'week'}.pdf`;
}

function downloadPdf(){
  if(isCanvasBlank('empSig')){
    showToast('Please add your signature before downloading');
    document.getElementById('empSig').scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  buildPdf().save(fileName());
  showToast('PDF downloaded');
}

function isCanvasBlank(id){
  const c = document.getElementById(id);
  const ctx = c.getContext('2d');
  const data = ctx.getImageData(0,0,c.width,c.height).data;
  for(let i=3; i<data.length; i+=4){ if(data[i] !== 0) return false; }
  return true;
}

async function submitTimesheet(){
  if(isCanvasBlank('empSig')){
    showToast('Please add your signature before submitting');
    document.getElementById('empSig').scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  const doc = buildPdf();
  const blob = doc.output('blob');
  const name = fileName();
  const file = new File([blob], name, {type:'application/pdf'});
  const weFormatted = state.weekEnding ? state.weekEnding.split('-').reverse().join('/') : '';
  const subjectText = `Timesheet weekending ${weFormatted}`;

  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({
        files:[file],
        title:subjectText,
        text:subjectText
      });
      showToast('Shared — pick Gmail to attach & send');
      return;
    }catch(err){
      if(err.name === 'AbortError') return;
    }
  }
  // fallback
  doc.save(name);
  const subject = encodeURIComponent(subjectText);
  const body = encodeURIComponent('Hi,\n\nPlease find my completed timesheet attached (just downloaded — attach it from your Downloads).\n\nThanks.');
  window.location.href = `mailto:aiden.tunupopo@gmail.com?subject=${subject}&body=${body}`;
  showToast('PDF downloaded — attach it in the email that opens');
}

const FIELD_TAGS = ['INPUT','SELECT','TEXTAREA'];
document.addEventListener('focusin', e=>{
  if(FIELD_TAGS.includes(e.target.tagName)){
    document.body.classList.add('kb-open');
    setTimeout(()=> e.target.scrollIntoView({block:'center', behavior:'smooth'}), 250);
  }
});
document.addEventListener('focusout', e=>{
  if(FIELD_TAGS.includes(e.target.tagName)){
    setTimeout(()=>{
      const active = document.activeElement;
      if(!active || !FIELD_TAGS.includes(active.tagName)) document.body.classList.remove('kb-open');
    }, 80);
  }
});

renderTabs(); renderDay(); renderTotals();
renderJobNumbersCard();
checkForNewMonth();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  });
}
</script>
